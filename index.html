<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="uploads/favicon-missao-193.png">
<title>Missão 193</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gfont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --primary: #11c1ca; --primary-2: #0d9488; --accent: #8b5cf6; --accent-2: #ec4899; --dark: #07091a;
  --font: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --ink: #0f172a; --text: #475569; --muted: #94a3b8; --line: #e2e8f0; --bg: #f8fafc;
  --grad: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, var(--accent-2) 100%);
  --btn: linear-gradient(135deg, var(--primary), var(--primary-2));
  --r: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body { font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
.wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
.narrow { max-width: 760px; }
.center { text-align: center; }
.center-x { justify-content: center; }
section { padding: 88px 0; position: relative; }
h1, h2, h3 { color: var(--ink); line-height: 1.15; letter-spacing: -0.02em; }
h2 { font-size: clamp(28px, 4vw, 42px); font-weight: 800; }
.grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.grid { display: grid; gap: 24px; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }

/* Botões */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 24px; border-radius: 10px; font-weight: 600; font-size: 15px; transition: transform .2s, box-shadow .2s, background .2s; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: var(--btn); color: #fff; box-shadow: 0 8px 24px -8px var(--primary); }
.btn-ghost { background: rgba(255,255,255,.06); color: #fff; border-color: rgba(255,255,255,.16); }
.btn-ghost:hover { background: rgba(255,255,255,.12); }
.btn-outline { border-color: var(--primary); color: var(--primary-2); background: #fff; margin-top: 40px; }
.btn-outline:hover { background: var(--primary); color: #fff; }
.btn-line { border-color: var(--primary); color: var(--primary); }
.btn-violet { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000)); color: #fff; box-shadow: 0 10px 30px -10px var(--accent); }
.btn-green { background: #22c55e; color: #fff; box-shadow: 0 10px 30px -10px #22c55e; }
.btn-sm { padding: 9px 16px; font-size: 13px; border-radius: 999px; }
.actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }

.badge { display: inline-block; padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--primary-2); background: color-mix(in srgb, var(--primary) 12%, #fff); border: 1px solid color-mix(in srgb, var(--primary) 25%, #fff); margin-bottom: 16px; }
.sec-head { text-align: center; max-width: 720px; margin: 0 auto 48px; }
.sec-head p { margin-top: 14px; font-size: 17px; }
.on-dark h2 { color: #fff; }
.on-dark p { color: #a5b0c8; }
.on-dark .badge { background: color-mix(in srgb, var(--accent-2) 12%, transparent); color: #f9a8d4; border-color: color-mix(in srgb, var(--accent-2) 30%, transparent); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }

/* Placeholder de imagem */
.ph { display: grid; place-items: center; background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 30%, #1e1b4b), color-mix(in srgb, var(--accent) 45%, #1e1b4b)); color: rgba(255,255,255,.85); font-weight: 700; text-align: center; padding: 20px; }

/* Header */
.topbar { position: fixed; inset: 0 0 auto; z-index: 50; background: color-mix(in srgb, var(--dark) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.06); transition: box-shadow .2s; }
.topbar.scrolled { box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.bar { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 24px; }
.logo { display: flex; align-items: center; flex-shrink: 0; }
.logo-img { max-height: 42px; width: auto; }
.logo-text { font-weight: 800; font-size: 20px; color: #fff; letter-spacing: -0.02em; }
.nav { display: flex; align-items: center; gap: 4px; flex: 1; justify-content: flex-end; }
.nav-link { color: #cbd5e1; font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 8px; }
.nav-link:hover { color: #fff; background: rgba(255,255,255,.06); }
.nav-btns { display: flex; gap: 10px; margin-left: 16px; }
.burger { display: none; background: none; border: 0; width: 40px; height: 40px; cursor: pointer; flex-direction: column; justify-content: center; gap: 5px; align-items: center; }
.burger span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; transition: .2s; }
.burger.x span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger.x span:nth-child(2) { opacity: 0; }
.burger.x span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Hero */
.hero { background: var(--dark); padding: 150px 0 90px; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse at 30% 40%, #000 30%, transparent 75%); }
.glow { position: absolute; width: 520px; height: 520px; border-radius: 50%; filter: blur(110px); opacity: .35; pointer-events: none; }
.g1 { background: var(--primary); top: -200px; left: -160px; }
.g2 { background: var(--accent); bottom: -260px; right: -120px; }
.hero-grid { position: relative; display: grid; grid-template-columns: 1.15fr .85fr; gap: 56px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; font-size: 13px; color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); margin-bottom: 24px; }
.hero h1 { color: #fff; font-size: clamp(34px, 5vw, 56px); font-weight: 800; }
.lead { color: #a5b0c8; font-size: 18px; margin-top: 22px; max-width: 560px; }
.stats { display: grid; grid-template-columns: repeat(4, auto); gap: 32px; margin-top: 44px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.08); justify-content: start; }
.stats strong { display: block; color: #fff; font-size: 26px; font-weight: 800; }
.stats span { color: #8691a8; font-size: 13px; }
.hero-media { position: relative; }
.hero-img, .hero-ph { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 24px; box-shadow: 0 30px 80px -20px color-mix(in srgb, var(--accent) 60%, transparent); border: 1px solid rgba(255,255,255,.1); font-size: 28px; }

/* Banner */
.banner { padding: 32px 0 0; background: #fff; }
.banner-link img { width: 100%; border-radius: var(--r); }

/* Cursos */
.courses { background: #fff; }
.filter { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: -16px 0 36px; }
.chip { border: 1px solid var(--line); background: #fff; padding: 8px 16px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; }
.chip.on, .chip:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.course { background: #fff; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; transition: transform .25s, box-shadow .25s; }
.course:hover { transform: translateY(-6px); box-shadow: 0 24px 48px -20px rgba(15,23,42,.25); }
.course-img img, .course-ph { width: 100%; aspect-ratio: 16/10; object-fit: cover; }
.course-body { padding: 20px 22px 22px; display: flex; flex-direction: column; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tags span { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 10%, #fff); color: color-mix(in srgb, var(--accent) 80%, #000); }
.course h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.course p { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 18px; }
.more { margin-top: auto; align-self: flex-end; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, #fff); padding: 8px 16px; border-radius: 999px; }
.more:hover { background: var(--accent); color: #fff; }

/* Seções escuras */
.dark-sec { background: var(--dark); color: #a5b0c8; }
.grad-sec { background: linear-gradient(180deg, color-mix(in srgb, var(--dark) 90%, #1e1b4b), color-mix(in srgb, var(--dark) 80%, #312e81)); }
.groups-logo { max-height: 64px; width: auto; margin: 0 auto 24px; }
.state-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.state { display: flex; flex-direction: column; align-items: center; padding: 18px 8px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); transition: .2s; text-align: center; }
.state strong { color: var(--primary); font-size: 22px; font-weight: 800; }
.state span { font-size: 12px; color: #8691a8; }
.state:hover { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); transform: translateY(-3px); }

.feat { padding: 28px; border-radius: var(--r); background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08); transition: .25s; }
.feat:hover { border-color: rgba(255,255,255,.2); transform: translateY(-4px); }
.feat-ic { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 18px; }
.t1 { background: color-mix(in srgb, var(--primary) 18%, transparent); color: var(--primary); }
.t2 { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); }
.t3 { background: color-mix(in srgb, var(--accent) 22%, transparent); color: #a78bfa; }
.t4 { background: rgba(250,204,21,.15); color: #facc15; }
.feat h3 { color: #fff; font-size: 17px; margin-bottom: 8px; }
.feat p { font-size: 14px; }
.features .btn-primary { margin-top: 48px; }

/* Sobre */
.about { background: var(--bg); }
.about-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 64px; align-items: center; }
.about-media { position: relative; }
.about-img, .about-ph { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 24px; font-size: 22px; }
.float-card { position: absolute; left: 24px; bottom: 24px; display: flex; gap: 12px; align-items: center; background: #fff; padding: 14px 18px; border-radius: 14px; box-shadow: 0 20px 40px -12px rgba(15,23,42,.3); color: var(--primary-2); }
.float-card strong { display: block; color: var(--ink); font-size: 14px; }
.float-card span { font-size: 12px; color: var(--text); }
.about-copy h2 { margin-bottom: 20px; }
.about-copy p { margin-bottom: 14px; }
.checks { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin: 22px 0; }
.checks li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink); }
.checks svg { color: var(--primary-2); flex-shrink: 0; margin-top: 3px; }
blockquote { border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, #fff); padding: 16px 20px; border-radius: 0 12px 12px 0; font-style: italic; font-weight: 600; color: var(--ink); margin-bottom: 26px; }
.about-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 64px; }
.about-stats div { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 24px; text-align: center; }
.about-stats strong { display: block; font-size: 32px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.about-stats span { font-size: 13px; }

.img-links { background: var(--bg); padding-top: 0; }
.img-link img { width: 100%; border-radius: var(--r); transition: transform .25s; }
.img-link:hover img { transform: translateY(-6px); }

/* Depoimentos */
.testimonials { background: #fff; }
.testi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.testi-score { grid-row: span 2; background: var(--dark); border-radius: 20px; padding: 36px 30px; color: #a5b0c8; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.testi-score .q { font-size: 90px; line-height: .6; color: var(--primary); opacity: .5; font-family: Georgia, serif; height: 40px; }
.testi-score strong { font-size: 56px; color: #fff; font-weight: 800; line-height: 1; }
.testi-score em { font-style: normal; color: #fff; font-weight: 600; }
.stars { display: flex; gap: 2px; color: #fbbf24; }
.stars svg { fill: currentColor; }
.testi { border: 1px solid var(--line); border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 14px; }
.testi p { color: var(--ink); font-size: 15px; flex: 1; }
.who { display: flex; gap: 12px; align-items: center; }
.avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.ini { display: grid; place-items: center; background: var(--grad); color: #fff; font-weight: 700; }
.who strong { display: block; color: var(--ink); font-size: 14px; }
.who span { font-size: 12px; }

/* Notícias */
.news { background: #f9f8f6; }
.news-title { text-align: center; margin-bottom: 40px; font-size: clamp(24px, 3vw, 32px); }
.news-card { position: relative; border-radius: var(--r); overflow: hidden; aspect-ratio: 3/4; display: block; background: var(--dark); }
.news-card img, .news-ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.news-card:hover img { transform: scale(1.06); }
.news-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(2,6,23,.92)); }
.news-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px; z-index: 1; }
.news-body h3 { color: #fff; font-size: 17px; margin-bottom: 8px; }
.news-body span { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: #cbd5e1; }

/* CTA */
.cta { background: linear-gradient(135deg, #0f172a 0%, color-mix(in srgb, var(--accent) 25%, #0f0a1e) 50%, #0f172a 100%); }
.eyebrow { display: block; color: var(--accent); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 700; margin-bottom: 14px; }
.cta h2 { color: #fff; }
.cta p { margin-top: 16px; font-size: 17px; }

/* Rodapé */
.foot { background: #050714; color: #8691a8; padding: 56px 0 24px; font-size: 14px; }
.foot-grid { display: flex; justify-content: space-between; gap: 40px; flex-wrap: wrap; }
.foot-grid p { max-width: 380px; margin: 14px 0 18px; }
.socials { display: flex; gap: 10px; }
.social { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,.06); color: #cbd5e1; }
.social:hover { background: var(--primary); color: #fff; }
.foot-links { display: flex; flex-direction: column; gap: 10px; }
.foot-links a:hover { color: #fff; }
.copy { border-top: 1px solid rgba(255,255,255,.06); margin-top: 40px; padding-top: 20px; font-size: 13px; }

.wa-float { position: fixed; right: 20px; bottom: 20px; width: 58px; height: 58px; border-radius: 50%; background: #22c55e; color: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px -6px rgba(34,197,94,.7); z-index: 60; transition: transform .2s; }
.wa-float:hover { transform: scale(1.08); }

/* Responsivo */
@media (max-width: 1024px) {
  .g4 { grid-template-columns: repeat(2, 1fr); }
  .state-grid { grid-template-columns: repeat(4, 1fr); }
  .nav { position: fixed; inset: 68px 0 auto; flex-direction: column; align-items: stretch; background: var(--dark); padding: 16px 20px 24px; border-bottom: 1px solid rgba(255,255,255,.08); transform: translateY(-120%); transition: transform .3s; gap: 2px; max-height: calc(100vh - 68px); overflow: auto; }
  .nav.open { transform: none; }
  .nav-link { padding: 12px; }
  .nav-btns { margin: 12px 0 0; }
  .burger { display: flex; }
}
@media (max-width: 860px) {
  section { padding: 64px 0; }
  .g3, .testi-grid { grid-template-columns: 1fr 1fr; }
  .hero { padding: 120px 0 64px; }
  .hero-grid, .about-grid { grid-template-columns: 1fr; gap: 40px; }
  .hero-media { max-width: 420px; }
  .stats, .about-stats { grid-template-columns: repeat(2, 1fr); }
  .testi-score { grid-row: auto; grid-column: span 2; }
}
@media (max-width: 560px) {
  .g3, .g4, .testi-grid, .checks { grid-template-columns: 1fr; }
  .testi-score { grid-column: auto; }
  .state-grid { grid-template-columns: repeat(3, 1fr); }
  .actions .btn { width: 100%; justify-content: center; }
  .nav-btns { flex-direction: column; }
  .nav-btns .btn { justify-content: center; }
}

/* ---------- Opções extras ---------- */
/* Hero com imagem de fundo */
.hero.has-bg { background: var(--dark) var(--hero-bg) center / cover no-repeat; min-height: 92vh; display: flex; align-items: center; }
.hero.has-bg::before { background: linear-gradient(90deg, color-mix(in srgb, var(--dark) 92%, transparent) 0%, color-mix(in srgb, var(--dark) 55%, transparent) 55%, transparent 100%), linear-gradient(0deg, var(--dark) 0%, transparent 30%); mask-image: none; background-size: auto; }
.hero.has-bg .glow { opacity: .15; }
.hero-grid.solo { grid-template-columns: minmax(0, 640px); }
.hero-emblem { max-height: 96px; width: auto; margin-bottom: 18px; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 22px; }
.hero-chips span { display: inline-flex; align-items: center; gap: 6px; color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.hero-chips svg { color: var(--primary); }
.hero .btn-green { box-shadow: 0 10px 30px -10px #22c55e; }
@media (max-width: 860px) {
  .hero.has-bg { background-image: var(--hero-bg-m); min-height: 0; padding-top: 120px; }
  .hero.has-bg::before { background: linear-gradient(0deg, var(--dark) 15%, color-mix(in srgb, var(--dark) 55%, transparent) 60%, color-mix(in srgb, var(--dark) 35%, transparent) 100%); }
  .hero.has-bg .hero-copy { padding-top: 34vh; }
}

/* Cursos só com imagem */
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.course.tile { border: 0; background: none; border-radius: 14px; }
.tile-link img, .tile-ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; }

/* Grupos com cartaz */
.state-grid.posters { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.state.poster { padding: 0; overflow: hidden; border-radius: 12px; }
.state.poster img { width: 100%; aspect-ratio: 1070 / 1470; object-fit: cover; }

/* Imagens com link */
.img-link-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
.img-link { flex: 0 1 260px; }

/* Tema escuro (todas as seções) */
body.theme-dark { --ink: #f8fafc; --text: #a5b0c8; --line: rgba(255,255,255,.1); --bg: var(--dark); background: var(--dark); }
.theme-dark .courses, .theme-dark .about, .theme-dark .testimonials, .theme-dark .news, .theme-dark .banner, .theme-dark .img-links { background: var(--dark); }
.theme-dark .groups, .theme-dark .features { background: color-mix(in srgb, var(--dark) 88%, #fff 3%); }
.theme-dark .course, .theme-dark .testi, .theme-dark .about-stats div, .theme-dark .chip { background: rgba(255,255,255,.04); }
.theme-dark .course.tile { background: none; }
.theme-dark .badge { background: color-mix(in srgb, var(--primary) 14%, transparent); border-color: color-mix(in srgb, var(--primary) 35%, transparent); color: var(--primary); }
.theme-dark .btn-outline { background: transparent; color: var(--primary); }
.theme-dark .btn-outline:hover { color: #fff; }
.theme-dark .chip.on, .theme-dark .chip:hover { background: var(--primary); border-color: var(--primary); }
.theme-dark .tags span, .theme-dark .more { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary); }
.theme-dark .float-card { background: #111; }
.theme-dark blockquote { background: rgba(255,255,255,.04); }
.theme-dark .testi-score { background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.theme-dark .foot { background: #000; }

/* Ajustes de celular */
@media (max-width: 1024px) {
  .nav { visibility: hidden; transition: transform .3s, visibility .3s; }
  .nav.open { visibility: visible; }
  .no-menu .burger { display: none; }
  .no-menu .nav { position: static; transform: none; visibility: visible; flex-direction: row; background: none; padding: 0; border: 0; max-height: none; }
  .no-menu .nav-btns { margin: 0; flex-direction: row; }
}
@media (max-width: 560px) {
  .tile-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .state-grid.posters { grid-template-columns: repeat(2, 1fr); }
  .img-link { flex-basis: calc(50% - 10px); }
}

.sq .course-img img, .sq .course-ph { aspect-ratio: 1; }

      '<button type="button" class="copy-link">' + icon('cards', 18) + '<span>Copiar link</span></button></div></div></article>' +
      (related.length ? '<section class="posts"><div class="wrap">' + head({ title: 'Leia também' }) + '<div class="grid g3">' + related.map(function (x) { return newsCard(x); }).join('') + '</div></div></section>' : '');
  };

  PAGES.notfound = function () {
    return pageHero('Página não encontrada', 'O conteúdo que você procura não existe ou foi removido.', null) +
      '<section><div class="wrap center">' + btn('Voltar ao início', './', 'btn-primary', 'arrow') + '</div></section>';
  };

  /* ---------- estrutura ---------- */
  function logo() {
    return D.site.logo ? img(D.site.logo, D.site.name, 'logo-img', true) : '<span class="logo-text">' + rich(D.site.logoText || D.site.name) + '</span>';
  }

  function header() {
    var h = D.header || {};
    return '<header class="topbar' + (P.type === 'home' ? '' : ' solid') + '"><div class="wrap bar' + (list(h.menu).length ? '' : ' no-menu') + '"><a class="logo" href="./">' + logo() + '</a>' +
      '<nav class="nav" id="nav">' + list(h.menu).map(function (m) { return a(m.url, 'nav-link', esc(m.label)); }).join('') +
      '<div class="nav-btns">' + btn(h.btn1Label, h.btn1Url, 'btn-sm btn-line', 'headset') + btn(h.btn2Label, h.btn2Url, 'btn-sm btn-primary', 'user') + '</div></nav>' +
      '<button class="burger" aria-label="Menu" id="burger"><span></span><span></span><span></span></button></div></header>';
  }

  function footer() {
    var f = D.footer || {};
    return '<footer class="foot"><div class="wrap foot-grid"><div><a class="logo" href="./">' + logo() + '</a><p>' + esc(f.text) + '</p>' +
      '<div class="socials">' + list(f.socials).map(function (x) { return a(x.url, 'social', icon(x.icon, 18)); }).join('') + '</div></div>' +
      '<nav class="foot-links">' + list(f.links).map(function (l) { return a(l.url, '', esc(l.label)); }).join('') + '</nav></div>' +
      '<div class="wrap copy">' + esc(f.copyright) + '</div></footer>';
  }

  function applyTheme() {
    var t = D.theme || {}, r = document.documentElement.style;
    document.body.classList.toggle('theme-dark', t.mode === 'escuro');
    var map = { primary: '--primary', primaryDark: '--primary-2', accent: '--accent', accent2: '--accent-2', dark: '--dark' };
    Object.keys(map).forEach(function (k) { if (t[k]) r.setProperty(map[k], t[k]); });
    var font = (t.font || 'Inter').replace(/[^\w ]/g, '');
    r.setProperty('--font', '"' + font + '", -apple-system, "Segoe UI", Roboto, sans-serif');
    var link = document.getElementById('gfont');
    var href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(font).replace(/%20/g, '+') + ':wght@400;500;600;700;800&display=swap';
    if (link && link.getAttribute('href') !== href) link.setAttribute('href', href);
  }

  function render(data, page) {
    D = data;
    P = page || { type: 'home' };
    applyTheme();
    var body = header() + '<main>' + (PAGES[P.type] || PAGES.notfound)() + '</main>' + footer();
    if (D.site.showWhatsappButton && D.site.whatsapp) body += a('whatsapp', 'wa-float', icon('whatsapp', 28));
    document.getElementById('app').innerHTML = body;
    bind();
  }

  function bind() {
    var burger = document.getElementById('burger'), nav = document.getElementById('nav');
    if (burger) burger.onclick = function () { nav.classList.toggle('open'); burger.classList.toggle('x'); };
    if (nav) nav.addEventListener('click', function (e) { if (e.target.closest('a')) { nav.classList.remove('open'); burger.classList.remove('x'); } });
    document.querySelectorAll('.filter, .cat-box').forEach(function (bar) {
      var scope = bar.parentNode;
      bar.querySelectorAll('[data-f]').forEach(function (c) {
        c.onclick = function () {
          bar.querySelectorAll('[data-f]').forEach(function (x) { x.classList.remove('on'); });
          c.classList.add('on');
          var f = c.getAttribute('data-f');
          scope.querySelectorAll('[data-tags]').forEach(function (el) {
            el.style.display = !f || el.getAttribute('data-tags').split('|').indexOf(f) >= 0 ? '' : 'none';
          });
          var main = bar.classList.contains('cat-box') && window.innerWidth <= 860 && scope.querySelector('.courses-main');
          if (main) main.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
      });
    });
    // carrossel (professores)
    document.querySelectorAll('.carousel').forEach(function (c) {
      var tr = c.querySelector('.car-track');
      function step() { return Math.max(tr.clientWidth * 0.8, 200); }
      c.querySelector('.prev').onclick = function () { tr.scrollBy({ left: -step(), behavior: 'smooth' }); };
      c.querySelector('.next').onclick = function () {
        if (tr.scrollLeft + tr.clientWidth >= tr.scrollWidth - 8) tr.scrollTo({ left: 0, behavior: 'smooth' }); else tr.scrollBy({ left: step(), behavior: 'smooth' });
      };
      if (!c.__auto) { c.__auto = setInterval(function () { if (!c.matches(':hover') && document.body.contains(c)) c.querySelector('.next').click(); }, 4500); }
    });
    // ampliar prints dos depoimentos
    document.querySelectorAll('[data-zoom]').forEach(function (b) {
      b.onclick = function () {
        var o = document.createElement('div'); o.className = 'lightbox';
        o.innerHTML = '<img src="' + esc(b.getAttribute('data-zoom')) + '" alt=""><button type="button" aria-label="Fechar">✕</button>';
        function close() { o.remove(); document.removeEventListener('keydown', key); }
        function key(e) { if (e.key === 'Escape') close(); }
        o.onclick = close; document.addEventListener('keydown', key); document.body.appendChild(o);
      };
    });
    var copy = document.querySelector('.copy-link');
    if (copy) copy.onclick = function () {
      if (navigator.clipboard) navigator.clipboard.writeText(location.href.replace(/[?&]preview=1/, '')).then(function () { copy.querySelector('span').textContent = 'Link copiado!'; });
    };
  }

  window.addEventListener('scroll', function () {
    var t = document.querySelector('.topbar');
    if (t) t.classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });

  // Prévia ao vivo dentro do painel
  if (/[?&]preview=1/.test(location.search)) {
    // na prévia, links internos não navegam (evita sair da prévia)
    document.addEventListener('click', function (e) {
      var l = e.target.closest('a');
      if (!l) return;
      e.preventDefault();
      var h = l.getAttribute('href') || '', t = /^#./.test(h) && document.getElementById(h.slice(1));
      if (t) t.scrollIntoView({ behavior: 'smooth' });
    });
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'site-preview') return;
      var y = window.scrollY, page = e.data.page || P, same = page.type === P.type && page.slug === P.slug;
      render(e.data.content, page);
      if (!same) window.scrollTo(0, 0);
      else if (e.data.scrollTo) {
        var el = document.getElementById(e.data.scrollTo) || document.querySelector('.' + e.data.scrollTo);
        if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, y);
      } else window.scrollTo(0, y);
    });
    if (window.parent !== window) window.parent.postMessage({ type: 'preview-ready' }, location.origin);
  }

  window.__render = render;
})();
</script>
<script>
(function () {
  function pageFromHash() {
    var h = decodeURIComponent(location.hash.slice(1)), m;
    if (h === 'pagina-cursos') return { type: 'courses' };
    if (h === 'pagina-noticias') return { type: 'news' };
    if ((m = /^curso-(.+)$/.exec(h))) return { type: 'course', slug: m[1] };
    if ((m = /^noticia-(.+)$/.exec(h))) return { type: 'article', slug: m[1] };
    return { type: 'home', anchor: h };
  }
  function hashFor(href) {
    var m;
    if (href === './' || href === '' || href === '/') return '';
    if (href === 'cursos') return 'pagina-cursos';
    if (href === 'noticias') return 'pagina-noticias';
    if ((m = /^curso\/([a-z0-9-]+)\/?$/.exec(href))) return 'curso-' + m[1];
    if ((m = /^noticia\/([a-z0-9-]+)\/?$/.exec(href))) return 'noticia-' + m[1];
    return null;
  }
  var current = null;
  function show() {
    var p = pageFromHash();
    var key = p.type + ':' + (p.slug || '');
    if (key !== current) { window.__render(window.SITE_DATA, p); current = key; window.scrollTo(0, 0); }
    if (p.anchor) { var el = document.getElementById(p.anchor); if (el) el.scrollIntoView(); }
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (/^(https?:|mailto:|tel:)/i.test(href)) return; // links externos abrem normalmente
    e.preventDefault();
    if (href.charAt(0) === '#') {
      var id = href.slice(1), el = document.getElementById(id);
      if (el && current === 'home:') el.scrollIntoView({ behavior: 'smooth' });
      else location.hash = id;
      return;
    }
    var h = hashFor(href);
    if (h === null) return;
    if (h === '') { history.replaceState(null, '', location.pathname + location.search); current = null; show(); return; }
    if (location.hash.slice(1) === h) window.scrollTo(0, 0); else location.hash = h;
  });
  window.addEventListener('hashchange', show);
  show();
})();</script>
